name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- ${{ matrix.channel }}
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Validate JavaScript library
        run: |
          moon version --all
          moon update
          # Preserve existing Array FFI and Show APIs during this compatibility repair.
          moon check --target js --deny-warn --warn-list -20
          moon fmt
          moon info --target js
          git diff --exit-code
          moon test --target js
          moon test --target js --release
  typo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1.19.0
